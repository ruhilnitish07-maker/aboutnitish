<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nitish Ruhal – Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#000;--font:'Bricolage Grotesque','Arial Black',Helvetica,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:500;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px 60px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:4px solid var(--fg);outline-offset:4px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1rem}
.toggle{font:inherit;font-weight:800;background:var(--bg);color:var(--fg);border:3px solid var(--fg);border-radius:999px;padding:8px 16px;cursor:pointer;transition:transform .2s,background .2s,color .2s}
.toggle:hover{background:var(--fg);color:var(--bg);transform:rotate(-4deg) scale(1.06)}
.toggle:active{transform:scale(.94)}

/* hero */
.hero{position:relative;padding:44px 0 30px}
.name{font-weight:800;font-size:clamp(4.2rem,24vw,9rem);line-height:.82;letter-spacing:-.05em;margin:0;text-transform:lowercase}
.name .row{display:block}
.name .ch{display:inline-block;transition:transform .3s cubic-bezier(.3,1.8,.5,1);cursor:default;animation:drop .8s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*60ms)}
.name .ch:hover{transform:translateY(-.12em) rotate(-10deg) scale(1.1)}
.name .cap{text-transform:uppercase;background:var(--fg);color:var(--bg);border-radius:.16em;padding:.06em .1em 0;margin-right:.05em;line-height:.9;rotate:-5deg}
.name .row:nth-child(2) .cap{rotate:4deg}
@keyframes drop{from{transform:translateY(-1.2em) rotate(12deg);opacity:0}}
.bio{font-size:clamp(1.2rem,5vw,1.5rem);font-weight:500;line-height:1.25;max-width:20em;margin:22px 0 0;letter-spacing:-.01em}
.badge{position:absolute;right:-6px;top:6px;width:104px;height:104px;animation:spin 14s linear infinite}
.badge text{font-weight:800;font-size:15px;letter-spacing:.12em;fill:var(--fg);text-transform:uppercase}
.badge circle{fill:var(--fg)}
.badge .dot{fill:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}

/* marquee */
.marq{margin:10px -20px 30px;background:var(--fg);color:var(--bg);overflow:hidden;white-space:nowrap;transform:rotate(-2.5deg);padding:12px 0}
.marq div{display:inline-block;font-weight:800;font-size:1.5rem;letter-spacing:-.02em;animation:slide 18s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}

/* links */
.links{display:grid;gap:16px;margin:0;padding:0;list-style:none}
.link{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 22px;border:3px solid var(--fg);border-radius:28px;background:var(--bg);box-shadow:6px 6px 0 var(--fg);font-weight:800;font-size:clamp(1.5rem,7vw,2.1rem);letter-spacing:-.03em;line-height:1;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,background .2s,color .2s}
.link small{display:block;font-size:.9rem;font-weight:500;letter-spacing:0;margin-top:8px;opacity:.75}
.link .go{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.link .go svg{width:20px;height:20px}
.links li:nth-child(odd) .link:hover{transform:translate(-4px,-4px) rotate(-1.6deg)}
.links li:nth-child(even) .link:hover{transform:translate(-4px,-4px) rotate(1.6deg)}
.link:hover{background:var(--fg);color:var(--bg);box-shadow:12px 12px 0 var(--fg)}
.link:hover .go{transform:rotate(-45deg) scale(1.15)}
.link:active{transform:translate(6px,6px) !important;box-shadow:0 0 0 var(--fg)}
.link.hl{background:var(--fg);color:var(--bg);box-shadow:6px 6px 0 var(--bg),6px 6px 0 3px var(--fg)}
.link.hl:hover{background:var(--bg);color:var(--fg)}

/* portfolio */
.work{margin:72px 0 0}
.work h2{font-weight:800;font-size:clamp(2.6rem,13vw,4.6rem);line-height:.9;letter-spacing:-.05em;margin:0 0 26px}
.proj{display:block;position:relative;border:3px solid var(--fg);border-radius:28px;padding:24px 22px 22px;margin-bottom:22px;background:var(--bg);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s}
.proj h3{font-weight:800;font-size:clamp(1.9rem,9vw,2.7rem);letter-spacing:-.04em;line-height:.95;margin:0 0 12px}
.proj p{margin:0 0 16px;font-size:1.05rem;line-height:1.38}
.proj .st{position:absolute;top:-16px;right:16px;background:var(--fg);color:var(--bg);border:3px solid var(--fg);border-radius:999px;padding:5px 14px;font-weight:800;font-size:.85rem;transform:rotate(4deg);transition:transform .3s cubic-bezier(.3,1.8,.5,1),background .2s,color .2s}
.proj .tags{margin:0}
.proj .tag{padding:5px 12px;font-size:.9rem;border-width:2px}
.proj:nth-of-type(odd):hover{transform:translate(-4px,-4px) rotate(-1.2deg)}
.proj:nth-of-type(even):hover{transform:translate(-4px,-4px) rotate(1.2deg)}
.proj:hover{background:var(--fg);color:var(--bg)}
.proj:hover .st{background:var(--bg);color:var(--fg);transform:rotate(-6deg) scale(1.1)}
.proj:hover .tag{border-color:var(--bg)}
.proj .tag:hover{background:var(--bg);color:var(--fg)}
.xp{margin-top:40px}
.xp h3{font-weight:800;font-size:1.6rem;letter-spacing:-.03em;margin:0 0 12px}
.xp .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;padding:16px 0;border-top:3px solid var(--fg)}
.xp .row:last-child{border-bottom:3px solid var(--fg)}
.xp .row b{font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.xp .row span{font-size:1rem;opacity:.8}

/* certificate */
.cert{margin-top:44px}
.cert h3{font-weight:800;font-size:1.6rem;letter-spacing:-.03em;margin:0 0 14px}
.certbtn{display:block;width:min(100%,340px);margin:0 auto;padding:0;border:3px solid var(--fg);border-radius:20px;overflow:hidden;background:var(--bg);cursor:zoom-in;box-shadow:6px 6px 0 var(--fg);rotate:-2deg;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.certbtn:hover{transform:translate(-4px,-4px) rotate(2deg) scale(1.03);box-shadow:12px 12px 0 var(--fg)}
.certbtn img{display:block;width:100%;height:auto}
.cert p{text-align:center;margin:20px 0 0;font-size:1rem}
.pdfrow{text-align:center;margin-top:16px}
.pdfbtn{display:inline-block;font-weight:800;font-size:1.1rem;border:3px solid var(--fg);border-radius:999px;padding:10px 22px;background:var(--bg);color:var(--fg);transition:transform .2s cubic-bezier(.3,1.8,.5,1),background .2s,color .2s}
.pdfbtn:hover{background:var(--fg);color:var(--bg);transform:rotate(-3deg) scale(1.06)}
.lb{position:fixed;inset:0;z-index:50;overflow:auto;-webkit-overflow-scrolling:touch;display:block;padding:calc(70px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px));background:#000;cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{display:block;width:min(100%,900px);height:auto;margin:0 auto;border:3px solid #fff;border-radius:14px;background:#fff}
.lbx{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;font:inherit;font-weight:800;background:#fff;color:#000;border:3px solid #fff;border-radius:999px;padding:8px 18px;cursor:pointer}

/* about */
.about{margin:64px 0 0}
.about h2{font-weight:800;font-size:clamp(2.6rem,13vw,4.6rem);line-height:.9;letter-spacing:-.05em;margin:0 0 18px}
.about p{font-size:1.2rem;line-height:1.4;margin:0 0 14px;max-width:30em}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.tag{border:3px solid var(--fg);border-radius:999px;padding:8px 16px;font-weight:800;transition:transform .25s cubic-bezier(.3,1.8,.5,1),background .2s,color .2s}
.tag:hover{background:var(--fg);color:var(--bg);transform:rotate(-5deg) scale(1.1)}

/* footer */
.foot{margin-top:70px;text-align:center}
.foot a{display:inline-block;font-weight:800;font-size:clamp(3rem,16vw,6rem);line-height:.9;letter-spacing:-.05em;transition:transform .3s cubic-bezier(.3,1.8,.5,1);border-bottom:6px solid var(--fg)}
.foot a:hover{transform:scale(1.07) rotate(-3deg)}
.foot p{margin:22px 0 0;font-size:.95rem}

/* scroll reveal */
.rv{opacity:0;transform:translateY(46px) scale(.96);transition:opacity .7s ease,transform .8s cubic-bezier(.2,1.2,.4,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.no-js .rv{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span id="handle"></span>
    <button class="toggle" id="theme" type="button" aria-label="Flip colours">flip it</button>
  </div>

  <header class="hero">
    <h1 class="name" id="name" aria-label=""></h1>
    <svg class="badge" viewBox="0 0 120 120" aria-hidden="true">
      <defs><path id="circ" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>
      <text><textPath href="#circ" id="badgeText"></textPath></text>
      <circle cx="60" cy="60" r="15"/><circle class="dot" cx="60" cy="60" r="5"/>
    </svg>
    <p class="bio" id="bio"></p>
  </header>

  <div class="marq" aria-hidden="true"><div id="marq"></div></div>

  <ul class="links" id="links"></ul>

  <section class="work" id="portfolio">
    <h2 class="rv" id="workTitle"></h2>
    <div id="projects"></div>
    <div class="xp rv">
      <h3 id="xpTitle"></h3>
      <div id="xpRows"></div>
    </div>
    <div class="cert rv">
      <h3 id="certTitle"></h3>
      <button class="certbtn" id="certBtn" type="button" aria-label="Open the certificate full size"><img id="certImg" alt="SmartED Campus Ambassador certificate for Nitish Ruhal, IILM University Gurugram, dated 29 August 2026" src="certificate.jpg"></button>
      <p id="certNote"></p>
      <div class="pdfrow"><a class="pdfbtn" href="/_blob/f6ac57e9e9d24948f25164db2193bdd6" target="_blank" rel="noopener noreferrer">Open the PDF</a></div>
    </div>
  </section>

  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Certificate"><button class="lbx" id="lbx" type="button">close</button><img id="lbImg" alt="SmartED Campus Ambassador certificate, full size"></div>

  <section class="about rv">
    <h2 id="aboutTitle"></h2>
    <div id="aboutText"></div>
    <div class="tags" id="tags"></div>
  </section>

  <footer class="foot rv">
    <a id="mail" href="#"></a>
    <p id="credit"></p>
  </footer>
</div>

<script>
/* ===== EDIT YOUR TEXT AND LINKS HERE ===== */
const CONFIG = {
  handle: "BTech CSE AIML",
  name: ["nitish", "ruhal"],              // each word sits on its own line
  bio: "AI & ML student at IILM Gurugram. I build apps, run a thrift streetwear brand and love turning ideas into real things.",
  badge: "open to internships • ",       // spins around the circle (about 25 characters)
  marquee: "build things • thrift drops • AI + ML • campus life • ",
  links: [
    { title: "E-Portfolio",     note: "My full portfolio website", url: "https://nitishe-portfolio.netlify.app/", highlight: true },
    { title: "Communication Toolkit", note: "Our live capstone website", url: "https://capstone1.figma.site" },
    { title: "Duffeldrops",     note: "Thrifted streetwear from Sarojini Nagar", url: "https://kindle-static-34693340.figma.site" },
    { title: "SmartED",         note: "Campus ambassador at IILM. Tap to see my certificate",       url: "/_blob/f6ac57e9e9d24948f25164db2193bdd6" },
    { title: "Campus Hide & Seek", note: "A real-life hide-and-seek game for students", url: "https://campushiders.netlify.app/" },
    { title: "UPI Spend Tracker", note: "AI that shows where your money goes",   url: "https://pep-alone-26911472.figma.site" },
    { title: "LinkedIn",        note: "Let’s connect",                            url: "https://www.linkedin.com/in/nitish-ruhal-a65711336" },
    { title: "GitHub",          note: "What I’m building",                        url: "https://github.com/ruhilnitish07-maker" }
  ],
  workTitle: "my work.",
  projects: [
    { title: "E-Portfolio", status: "Live", url: "https://nitishe-portfolio.netlify.app/",
      text: "My portfolio website for Professional Communication Skills for Engineers: who I am, my capstone work and what I learned in Semester 1.",
      tags: ["portfolio", "capstone", "Semester 1"] },
    { title: "Student Communication Toolkit", status: "Live", url: "https://capstone1.figma.site",
      text: "Our team capstone: a one-stop website with 7 tabs that helps students write emails, present, run meetings, write reports and build resumes and LinkedIn profiles. I built the website in Figma and made the 23-slide team deck. 50 students answered our survey.",
      tags: ["Figma", "team of six", "Team Codecast"] },
    { title: "Duffeldrops", status: "Live", url: "https://kindle-static-34693340.figma.site",
      text: "A thrift streetwear store with finds from Sarojini Nagar. Browse, add to cart and check out.",
      tags: ["e-commerce", "streetwear", "thrift"] },
    { title: "Campus Hide & Seek", status: "Live", url: "https://campushiders.netlify.app/",
      text: "A website game for university students. Players join a lobby, get a hider or seeker role on their phone, and phones check how close they are when a hider is found.",
      tags: ["web app", "multiplayer", "phones"] },
    { title: "UPI Spend Tracker", status: "Live", url: "https://pep-alone-26911472.figma.site",
      text: "An AI app that sorts your UPI spending into categories, sets savings goals and budgets, and points out what you could stop spending on.",
      tags: ["AI", "fintech", "mobile app"] }
  ],
  xpTitle: "experience & education",
  certTitle: "certificate",
  certNote: "SmartED Campus Ambassador, 29 August 2026. Tap to zoom.",
  experience: [
    { role: "Campus Ambassador", place: "SmartED, IILM University Gurugram", when: "Aug 2026" },
    { role: "BTech CSE (AI & ML)", place: "IILM University, Gurugram", when: "Now" }
  ],
  aboutTitle: "hi, i’m nitish.",
  about: [
    "I’m a BTech CSE (AI & ML) student at IILM University, Gurugram, building things on the side and learning as fast as I can.",
    "I run Duffeldrops, my thrift streetwear brand, and I’m the SmartED Campus Ambassador at IILM. Right now I’m working on a campus hide-and-seek game and an AI app that tracks UPI spending. Next goal: a tech internship."
  ],
  tags: ["BTech CSE AIML", "IILM Gurugram", "IELTS 7.5", "Duffeldrops", "SmartED", "app builder"],
  email: "ruhilnitish07@gmail.com",
  emailLabel: "say hi",
  credit: "Nitish • IILM University, Gurugram"
};
/* ===== END OF EDITABLE SECTION ===== */

const $ = id => document.getElementById(id);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.textContent = h; return e; };

$("handle").textContent = CONFIG.handle;
document.title = CONFIG.name.join(" ") + " – Links";
$("bio").textContent = CONFIG.bio;
$("badgeText").textContent = CONFIG.badge.repeat(2);
$("aboutTitle").textContent = CONFIG.aboutTitle;
$("marq").textContent = CONFIG.marquee.repeat(8);

const nameEl = $("name");
nameEl.setAttribute("aria-label", CONFIG.name.join(" "));
let n = 0;
CONFIG.name.forEach(word => {
  const row = el("span", "row"); row.setAttribute("aria-hidden", "true");
  [...word].forEach((c, k) => { const s = el("span", k === 0 ? "ch cap" : "ch", c); s.style.setProperty("--i", n++); row.appendChild(s); });
  nameEl.appendChild(row);
});

const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
CONFIG.links.forEach((l, i) => {
  const li = el("li", "rv"); li.style.setProperty("--d", (i % 3) * 70 + "ms");
  const a = el("a", "link" + (l.highlight ? " hl" : ""));
  a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  const t = el("span"); t.appendChild(document.createTextNode(l.title));
  if (l.note) t.appendChild(el("small", "", l.note));
  const g = el("span", "go"); g.innerHTML = arrow;
  a.append(t, g); li.appendChild(a); $("links").appendChild(li);
});

$("workTitle").textContent = CONFIG.workTitle;
$("xpTitle").textContent = CONFIG.xpTitle;
CONFIG.projects.forEach(p => {
  const a = el(p.url ? "a" : "div", "proj rv"); if (p.url) { a.href = p.url; a.target = "_blank"; a.rel = "noopener noreferrer"; }
  a.append(el("span", "st", p.status), el("h3", "", p.title), el("p", "", p.text));
  const tg = el("div", "tags"); p.tags.forEach(t => tg.appendChild(el("span", "tag", t))); a.appendChild(tg);
  $("projects").appendChild(a);
});
CONFIG.experience.forEach(x => {
  const r = el("div", "row"); const l = el("div"); l.append(el("b", "", x.role), el("br"), el("span", "", x.place));
  r.append(l, el("span", "", x.when)); $("xpRows").appendChild(r);
});
CONFIG.about.forEach(p => $("aboutText").appendChild(el("p", "", p)));
CONFIG.tags.forEach(t => $("tags").appendChild(el("span", "tag", t)));
const mail = $("mail"); mail.href = "mailto:" + CONFIG.email; mail.textContent = CONFIG.emailLabel;
$("credit").textContent = CONFIG.credit;

$("certTitle").textContent = CONFIG.certTitle;
$("certNote").textContent = CONFIG.certNote;
const lb = $("lb"), closeLb = () => { lb.hidden = true; $("certBtn").focus(); };
$("certBtn").addEventListener("click", () => { $("lbImg").src = $("certImg").src; lb.hidden = false; $("lbx").focus(); });
lb.addEventListener("click", closeLb);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !lb.hidden) closeLb(); });

/* scroll reveal */
const items = document.querySelectorAll(".rv");
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15, rootMargin: "0px 0px -6% 0px" });
  items.forEach(i => io.observe(i));
} else items.forEach(i => i.classList.add("in"));

/* colour flip */
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
</script>
</body>
</html>
